[package]
name = "yara-convertor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yara_convertor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
regex = "1"  # static heuristic scanning for semantic-drift risks (layer 2)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned EXACTLY to the YARA-X version embedded in the Corelight v29.3 sensor.
# Do not relax this constraint without confirming the sensor's version — the
# verdict is only trustworthy when this matches the sensor exactly.
yara-x = "=1.20.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
